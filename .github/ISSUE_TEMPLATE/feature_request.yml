name: Feature request
description: An idea that would make SKradle better
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like SKradle to do?
      description: How do you imagine it working? Sketches and screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Any workaround, or another tool that does it well.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Which part is it about?
      options:
        - Launching
        - Home
        - Servers (including my own server)
        - Mods
        - Settings
        - Updates and installing SKradle
        - Something else
    validations:
      required: false
