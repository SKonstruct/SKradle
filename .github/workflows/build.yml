name: Build

# Test builds of the launcher for every platform, to download and try. Run it from the Actions tab ("Run workflow" on
# any branch) or push a tag like v0.1.0. It uploads one artifact per platform and nothing else: no release is made,
# nothing is committed or published. Builds are unsigned (see the README: macOS needs `xattr -cr`, Windows SmartScreen
# asks once). Linux arm64 is not built: the game ships no Linux arm64 runtime or natives.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same Qt and aqtinstall pin as ci.yml (see the comments there).
  QT_VERSION: 6.11.3
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
  # Pinned tools for the AppImage, checked against these SHA-256 sums before they run.
  LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  LINUXDEPLOY_QT_URL: https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
  LINUXDEPLOY_QT_SHA256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # An experimental leg (a runner label or Qt architecture not yet proven) may fail without failing the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # qt_modules: the QtWebView add-on exists for macOS and Windows; the Linux one only ships the webengine plugin,
          # so Linux builds without it and the "My server" page opens the browser instead.
          - { name: linux-x64, os: ubuntu-latest, qt_arch: "", qt_modules: "", experimental: false }
          - { name: macos-arm64, os: macos-latest, qt_arch: "", qt_modules: qtwebview, experimental: false }
          - { name: macos-x64, os: macos-15-intel, qt_arch: "", qt_modules: qtwebview, experimental: true }
          - { name: windows-x64, os: windows-latest, qt_arch: win64_msvc2022_64, qt_modules: qtwebview, experimental: false }
          - { name: windows-arm64, os: windows-11-arm, qt_arch: win64_msvc2022_arm64, qt_host: windows_arm64, qt_modules: qtwebview, experimental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Work out the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"
          else version="$base-${GITHUB_SHA::7}"; fi
          case "$version" in *[!A-Za-z0-9._+-]*|"") echo "unusable version: $version" >&2; exit 1;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # One cache per platform for the app, shared by CI and the Build workflow; only main saves it
          # (a pull request's cache cannot be used by main and only crowds out the useful ones).
          shared-key: app-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libegl1 libfontconfig1 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1

      # The build script asks Qt for its paths with qmake: point it at the one install-qt-action installed.
      - name: Point the build at Qt's qmake
        run: echo "QMAKE=$QT_ROOT_DIR/bin/qmake" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build -p skradle-app --release --locked

      # A build that does not start is not worth uploading.
      - name: Self-test
        timeout-minutes: 5
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software; fi
          exe=target/release/skradle; if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" --selftest

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          packaging/macos.sh target/release/skradle "$VERSION" dist "${{ matrix.name }}"

      - name: Package (Windows .zip)
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          packaging/windows.sh target/release/skradle.exe "$VERSION" dist "${{ matrix.name }}"

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist tools
          curl -fsSL -o tools/linuxdeploy-x86_64.AppImage "$LINUXDEPLOY_URL"
          curl -fsSL -o tools/linuxdeploy-plugin-qt-x86_64.AppImage "$LINUXDEPLOY_QT_URL"
          echo "$LINUXDEPLOY_SHA256  tools/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "$LINUXDEPLOY_QT_SHA256  tools/linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x tools/*.AppImage
          LINUXDEPLOY_DIR="$PWD/tools" packaging/linux.sh target/release/skradle "$VERSION" dist "${{ matrix.name }}"

      - name: Checksums
        run: |
          # A package must exist (the checksum file alone would make a 200-byte "build").
          ls dist | grep -E '\.(dmg|zip|AppImage)$' || { echo "no package was produced" >&2; exit 1; }
          cd dist
          (sha256sum * 2>/dev/null || shasum -a 256 *) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SKradle-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: dist
          if-no-files-found: error
          retention-days: 30
