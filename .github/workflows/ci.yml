name: CI

# Three stages, each starting only when the one before passed, so a failure never costs the expensive part and nothing
# is uploaded for it:
#   test    (Linux, macOS, Windows in parallel)  format, lints and every unit test of the core and the app
#   build   (the five release targets in parallel)  release build, headless self-test and screenshots, then the package
#                                                    (.dmg for macOS, a per-user -installer.exe for Windows, an AppImage
#                                                    for Linux) and its SHA256SUMS.txt as one artifact per platform
#   release (version tags only)                      publishes the installers and SHA256SUMS.txt as a GitHub Release,
#                                                    which is what the launcher's own update reads
# Screenshots are uploaded as SKradle-<version>-<platform>-screenshots. Packages are made for pushes to main, version tags (v*) and manual runs, not for pull requests. Builds are unsigned
# (macOS needs `xattr -cr`, Windows SmartScreen asks once). Nothing is committed. Linux arm64 is not part of v1: the game
# ships no Linux arm64 runtime or natives.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer run of the same ref cancels the one in progress, so runs never queue up behind each other.
  cancel-in-progress: true

env:
  # macOS needs 6.11 (6.10's headers do not compile with the macOS 26 compiler). aqtinstall 3.3.0 cannot find 6.11's
  # Windows x64 packages, so the install uses a pinned commit of its master branch that can. Switch back to a released
  # version once aqtinstall 3.4 is out.
  QT_VERSION: 6.11.3
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
  # Pinned tools for the AppImage, checked against these SHA-256 sums before they run.
  LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  LINUXDEPLOY_QT_URL: https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
  LINUXDEPLOY_QT_SHA256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724
  # Inno Setup (the Windows installer compiler), the official installer, checked against this SHA-256 (GitHub's digest of
  # the release asset) before it runs. 6.6 or newer is needed for the installer's light and dark mode.
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
  INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c

defaults:
  run:
    shell: bash

jobs:
  # Everything that can fail fast, on all three systems: format, the catalogue source, clippy and the tests of both
  # crates (the app crate needs Qt to compile, so Qt is installed here too; its install is cached).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, qt_arch: "", qt_modules: "" }
          - { os: macos-latest, qt_arch: "", qt_modules: qtwebview }
          - { os: windows-latest, qt_arch: win64_msvc2022_64, qt_modules: qtwebview }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # One cache per platform, only main saves it
          # (a pull request's cache cannot be used by main and only crowds out the useful ones).
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libegl1 libfontconfig1 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1

      # The build script asks Qt for its paths with qmake: point it at the one install-qt-action installed.
      - name: Point the build at Qt's qmake
        run: echo "QMAKE=$QT_ROOT_DIR/bin/qmake" >> "$GITHUB_ENV"

      # Platform independent: once is enough.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Rust-side sentences are in the catalogue source
        if: runner.os == 'Linux'
        run: python3 app/i18n/rust_strings.py --check || { echo 'run app/i18n/update.sh'; exit 1; }

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  # The launcher itself (crate skradle-app: Qt Quick UI bridged to skradle-core with cxx-qt): the release build for each
  # target, started headless for its self-test and its screenshots, then packaged. Only after every test leg passed.
  app:
    name: app ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Experimental legs may fail without failing the workflow (runner labels or Qt architectures not yet proven).
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # qt_modules: the QtWebView add-on exists in the Qt repository on macOS and Windows; the Linux one only ships
          # the webengine plugin, so Linux builds without it and the app falls back to the browser there.
          - { name: linux-x64, os: ubuntu-latest, qt_arch: "", qt_modules: "", experimental: false }
          - { name: macos-arm64, os: macos-latest, qt_arch: "", qt_modules: qtwebview, experimental: false }
          - { name: macos-x64, os: macos-15-intel, qt_arch: "", qt_modules: qtwebview, experimental: true }
          - { name: windows-x64, os: windows-latest, qt_arch: win64_msvc2022_64, qt_modules: qtwebview, experimental: false }
          - { name: windows-arm64, os: windows-11-arm, qt_arch: win64_msvc2022_arm64, qt_host: windows_arm64, qt_modules: qtwebview, experimental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # One cache per target for the app, only main saves it
          # (a pull request's cache cannot be used by main and only crowds out the useful ones).
          shared-key: app-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libegl1 libfontconfig1 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1

      # The build script asks Qt for its paths with qmake: point it at the one install-qt-action installed.
      - name: Point the build at Qt's qmake
        run: echo "QMAKE=$QT_ROOT_DIR/bin/qmake" >> "$GITHUB_ENV"

      - name: Build
        env:
          # The crash reporter's project (a public client key, kept as a secret so forks do not report to it). Without
          # the secret (forks, pull requests from bots) the reporter is compiled out; "Send crash reports" in Settings
          # still switches it off for players.
          SKRADLE_SENTRY_DSN: ${{ secrets.SKRADLE_SENTRY_DSN }}
        run: cargo build -p skradle-app --release --locked

      - name: Self-test
        timeout-minutes: 5
        env:
          # On Windows Qt logs to the debugger unless told otherwise.
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software; fi
          exe=target/release/skradle; if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" --selftest

      - name: Screenshots
        timeout-minutes: 10
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software; fi
          exe=target/release/skradle; if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          mkdir -p shots
          "$exe" --shots shots --prefix "${{ matrix.name }}"
          ls -l shots

      - name: Work out the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"
          else version="$base-${GITHUB_SHA::7}"; fi
          case "$version" in *[!A-Za-z0-9._+-]*|"") echo "unusable version: $version" >&2; exit 1;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging $version"

      # Only for a leg that passed everything before it.
      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SKradle-${{ steps.version.outputs.version }}-${{ matrix.name }}-screenshots
          path: shots
          if-no-files-found: ignore

      # ---- packages (not for pull requests) ----------------------------------------------------------------------
      - name: Package (macOS .dmg)
        if: github.event_name != 'pull_request' && runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          packaging/macos.sh target/release/skradle "$VERSION" dist "${{ matrix.name }}"

      - name: Package (Windows installer)
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p tools
          curl -fsSL --retry 5 --retry-all-errors -o tools/innosetup.exe "$INNO_URL"
          echo "$INNO_SHA256  tools/innosetup.exe" | sha256sum -c -
          # Installed into the workspace for the current user, silently (single slashes are options, not paths).
          MSYS2_ARG_CONV_EXCL='*' ./tools/innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER "/DIR=$(cygpath -w "$PWD/tools/inno")"
          [ -f tools/inno/ISCC.exe ] || { echo "Inno Setup was not installed" >&2; exit 1; }
          export ISCC="$PWD/tools/inno/ISCC.exe"
          mkdir dist
          packaging/windows.sh target/release/skradle.exe "$VERSION" dist "${{ matrix.name }}"

      - name: Package (Linux AppImage)
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist tools
          curl -fsSL -o tools/linuxdeploy-x86_64.AppImage "$LINUXDEPLOY_URL"
          curl -fsSL -o tools/linuxdeploy-plugin-qt-x86_64.AppImage "$LINUXDEPLOY_QT_URL"
          echo "$LINUXDEPLOY_SHA256  tools/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "$LINUXDEPLOY_QT_SHA256  tools/linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x tools/*.AppImage
          LINUXDEPLOY_DIR="$PWD/tools" packaging/linux.sh target/release/skradle "$VERSION" dist "${{ matrix.name }}"

      - name: Checksums
        if: github.event_name != 'pull_request'
        run: |
          # The artifact is one folder (the download is the zip around it): the package, and SHA256SUMS.txt inside the
          # same folder, listing every file in it (check with `sha256sum -c SHA256SUMS.txt` or `shasum -a 256 -c`).
          folder=$(find dist -mindepth 1 -maxdepth 1 -type d | head -1)
          [ -n "$folder" ] || { echo "no package folder was produced" >&2; exit 1; }
          # A package must exist (the checksum file alone would make a 200-byte "build").
          ls "$folder" | grep -E '^SKradle-.*\.(dmg|AppImage|exe)$' || { echo "no package was produced" >&2; exit 1; }
          (cd "$folder" && find . -type f ! -name SHA256SUMS.txt | sed 's|^\./||' | sort | while IFS= read -r f; do
            sha256sum "$f" 2>/dev/null || shasum -a 256 "$f"
          done > SHA256SUMS.txt)
          head -5 "$folder/SHA256SUMS.txt"; echo "... $(wc -l < "$folder/SHA256SUMS.txt") files"

      - name: Upload package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SKradle-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  # A version tag publishes the installers (as they are, not zipped: the launcher's update downloads them by name and
  # checks GitHub's SHA-256 of each) with one SHA256SUMS.txt. Needs every package; runs only for tags.
  release:
    name: release
    if: github.ref_type == 'tag'
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: SKradle-*
          path: packages
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Each artifact is one folder holding its installer; the release wants them side by side.
          mkdir release
          find packages -type f \( -name 'SKradle-*.dmg' -o -name 'SKradle-*.exe' -o -name 'SKradle-*.AppImage' \) -exec cp {} release/ \;
          cd release
          ls -l
          files=$(ls SKradle-*.dmg SKradle-*.exe SKradle-*.AppImage 2>/dev/null)
          [ -n "$files" ] || { echo "no installers were downloaded" >&2; exit 1; }
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "SKradle ${TAG#v}" --generate-notes --verify-tag
          fi
