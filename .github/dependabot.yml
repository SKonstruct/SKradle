version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # The launcher core (workspace root: Cargo.toml and Cargo.lock).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust:
        patterns: ["*"]

  # Spikes are standalone crates with their own lock files.
  - package-ecosystem: cargo
    directory: /spikes/native-look/ffi/rust
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: /spikes/native-look/cxxqt
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # These crates must be on the same version.
      cxx-qt:
        patterns: ["cxx-qt*", "cxx"]
