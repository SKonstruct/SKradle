# The .deb and .rpm of SKradle (nfpm, see packaging/linux.sh): the AppImage's AppDir (SKradle and the Qt it needs)
# installed under /opt/SKradle, with `skradle` (a one-line launcher) in /usr/bin and the menu entry and icon where desktops look for them.
# Run it from the folder that holds AppDir/ and pkgfiles/ (packaging/linux.sh sets both up); the version comes from
# the environment (SK_VERSION).
name: skradle
arch: amd64
platform: linux
version: ${SK_VERSION}
section: games
priority: optional
maintainer: SKonstruct <https://github.com/SKonstruct/SKradle>
description: |
  Launcher for Spiral Knights
  Finds your Spiral Knights install, applies your mods, picks the server, starts the game and can host a private
  server. Unofficial fan project, not affiliated with Grey Havens.
vendor: SKonstruct
homepage: https://github.com/SKonstruct/SKradle
license: MIT
contents:
  - src: ./AppDir
    dst: /opt/SKradle
    type: tree
  # Not a symlink: the AppDir's launcher finds its files from the path it is started by, so it must be started as
  # /opt/SKradle/AppRun.
  - src: ./pkgfiles/skradle-launcher
    dst: /usr/bin/skradle
    file_info:
      mode: 0755
  - src: ./pkgfiles/skradle.desktop
    dst: /usr/share/applications/skradle.desktop
  - src: ./pkgfiles/skradle.png
    dst: /usr/share/icons/hicolor/256x256/apps/skradle.png
  - src: ./pkgfiles/LICENSE
    dst: /usr/share/doc/skradle/copyright
