[package]
name = "skradle-core"
description = "SKradle launcher logic: game discovery, updater driver, mods, servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# HTTPS client (rustls, bundled root certificates).
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
sha2 = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

[dev-dependencies]
tempfile = "3"
